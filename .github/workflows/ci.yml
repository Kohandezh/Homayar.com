name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "ci-${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "11.1.2"
  PYTHON_VERSION: "3.12"
  UV_VERSION: "0.11.24"
  CI: "true"

jobs:
  source-contract:
    name: Product source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      # The product source is tracked under Homayar/ in this repository
      # (ADR 0033); the contract rejects a gitlink, missing required paths and
      # tracked runtime data.
      - name: Verify product source contract
        run: infra/ci/check-source-contract.sh --mode ci

      - name: Run source contract checker tests
        run: bash infra/ci/tests/test-check-source-contract.sh

  public-web:
    name: Public web lint, build, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "${{ env.NODE_VERSION }}"

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare "pnpm@${PNPM_VERSION}" --activate

      - name: Configure approved pnpm dependency builds
        run: >-
          pnpm config set --location=project --json allowBuilds
          '{"esbuild":true,"sharp":true,"unrs-resolver":true}'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # The cPanel export script and the Playwright suite belong to the website
      # overlay (WP01-T03) that is not in this repository yet. Each gate runs as
      # soon as its files are committed; until then the run carries a warning.
      - name: Report website gates not yet in the repository
        if: hashFiles('scripts/build-cpanel.mjs') == '' || hashFiles('tests/**/*.spec.ts') == ''
        run: >-
          echo "::warning title=Website gates pending::scripts/build-cpanel.mjs and/or tests/*.spec.ts
          are not committed (website overlay, WP01-T03); the cPanel export and/or browser tests were skipped."

      - name: Build and validate cPanel static artifact
        if: hashFiles('scripts/build-cpanel.mjs') != ''
        run: pnpm build:cpanel

      - name: Install Playwright Chromium
        if: hashFiles('tests/**/*.spec.ts') != ''
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        if: hashFiles('tests/**/*.spec.ts') != ''
        run: pnpm test:e2e

  console-web:
    name: Product console lint, build, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: source-contract
    defaults:
      run:
        working-directory: Homayar/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Verify product console source is present
        working-directory: .
        run: >-
          test -f Homayar/frontend/package.json ||
          { echo 'Homayar/frontend is missing from this commit; the product source is tracked in this repository (ADR 0033).' >&2; exit 2; }

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: Homayar/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        env:
          VITE_API_URL: /api/v1
        run: npm run build -- --base=/app/

      - name: Require a test script
        run: >-
          node -e "const p=JSON.parse(require('fs').readFileSync('package.json','utf8'));
          if (!p.scripts?.test) { console.error('A package.json test script is required for the console release gate.'); process.exit(1); }"

      - name: Run tests
        run: npm test

  linear-agent:
    name: Linear agent typecheck, lint, and tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: tools/linear-agent
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "${{ env.NODE_VERSION }}"
          cache: npm
          cache-dependency-path: tools/linear-agent/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

  backend:
    name: Backend tests and migrations
    runs-on: ubuntu-24.04
    # pytest alone took about 22 minutes on 2f5f666; 40 leaves room for runner variance.
    timeout-minutes: 40
    needs: source-contract
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: homayar_test
          POSTGRES_USER: homayar_test
          POSTGRES_PASSWORD: ci-only-postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "test \"$(cat /proc/1/comm)\" = postgres && pg_isready -U homayar_test -d homayar_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      ENVIRONMENT: test
      DEPLOYMENT_MODE: onprem
      DATABASE_URL: postgresql+psycopg://homayar_test:ci-only-postgres@127.0.0.1:5432/homayar_test
      TEST_DATABASE_URL: postgresql+psycopg://homayar_test:ci-only-postgres@127.0.0.1:5432/homayar_test
      HOMAYAR_REQUIRE_POSTGRES_TESTS: "1"
      HOMAYAR_REQUIRE_MEDIA_TOOLS: "1"
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/1
      JWT_SECRET: ci-only-jwt-secret-000000000000000000000000
      TOKEN_PEPPER: ci-only-token-pepper-000000000000000000000
      STORAGE_BACKEND: local
      STORAGE_LOCAL_ROOT: /tmp/homayar-test-objects
      UPLOAD_DIR: /tmp/homayar-test-uploads
      UPLOAD_QUARANTINE_DIR: /tmp/homayar-test-quarantine
      TASKS_EAGER: "true"
      ALLOW_MOCK_PROVIDERS: "true"
      AUTO_CREATE_SCHEMA: "false"
      ENABLE_NEO4J_PROJECTION: "false"
      NEO4J_URI: bolt://127.0.0.1:1
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ci-only-neo4j
      # HOM-172 owner decision (2026-10-10): the golden normalization module keeps its
      # 30 s budget everywhere except here; shared runners took 37-77 s. The owner test
      # accepts 30 to 300 s and only with CI=true (docs/operations/ci.md).
      HOMAYAR_GOLDEN_BUDGET_SECONDS: "120"
    defaults:
      run:
        working-directory: Homayar
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The HOM-172 owner tests read source files at the base commit (`git show`).
          fetch-depth: 0

      - name: Verify backend source is present
        working-directory: .
        run: |
          if ! test -f Homayar/pyproject.toml || ! test -f Homayar/uv.lock || ! test -f Homayar/alembic.ini; then
            echo 'Homayar backend sources are missing from this commit; the product source is tracked in this repository (ADR 0033).' >&2
            exit 2
          fi

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends ffmpeg
          ffmpeg -hide_banner -version | head -n 1
          ffprobe -hide_banner -version | head -n 1

      - name: Install uv
        run: python -m pip install "uv==${UV_VERSION}"

      # --locked also refuses a uv.lock that is stale against pyproject.toml (HOM-28).
      - name: Install locked dependencies
        run: uv sync --locked

      - name: Validate and apply migrations
        run: uv run ../infra/ci/check-migrations.sh backend

      - name: Run backend tests
        run: uv run pytest backend/tests --quiet -rs

  secret-scan:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Scan Git history with Gitleaks
        run: >-
          docker run --rm
          --user "$(id -u):$(id -g)"
          --volume "${PWD}:/repo:ro"
          --tmpfs /tmp
          ghcr.io/gitleaks/gitleaks:v8.28.0
          git --redact --verbose --log-opts="--all" /repo

  container-config:
    name: Container configuration
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    needs: source-contract
    env:
      PUBLIC_ORIGIN: http://localhost:8080
      CORS_ORIGINS: http://localhost:8080
      TRUSTED_HOSTS: localhost,127.0.0.1
      DATABASE_URL: postgresql+psycopg://homayar:ci-only@postgres:5432/homayar
      REDIS_URL: redis://:ci-only@redis:6379/0
      JWT_SECRET: ci-only-jwt-secret-000000000000000000000000
      TOKEN_PEPPER: ci-only-token-pepper-000000000000000000000
      STORAGE_ACCESS_KEY: homayar-app
      STORAGE_SECRET_KEY: ci-only-storage-secret-0000000000000000
      STORAGE_BUCKET: homayar-private
      STORAGE_REGION: us-east-1
      POSTGRES_DB: homayar
      POSTGRES_USER: homayar
      POSTGRES_PASSWORD: ci-only-postgres
      REDIS_PASSWORD: ci-only-redis
      MINIO_ROOT_USER: homayar-root
      MINIO_ROOT_PASSWORD: ci-only-minio-root
      NEO4J_PASSWORD: ci-only-neo4j
      PUBLIC_WEB_IMAGE: example.invalid/homayar/public-web@sha256:1111111111111111111111111111111111111111111111111111111111111111
      CONSOLE_WEB_IMAGE: example.invalid/homayar/console-web@sha256:2222222222222222222222222222222222222222222222222222222222222222
      API_IMAGE: example.invalid/homayar/api@sha256:3333333333333333333333333333333333333333333333333333333333333333
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Lint GitHub Actions workflow
        run: >-
          docker run --rm
          --volume "${PWD}:/repo:ro"
          --workdir /repo
          rhysd/actionlint:1.7.7
          -color=false
          .github/workflows/ci.yml

      - name: Validate on-prem Compose profile
        run: docker compose --file infra/compose/compose.onprem.yaml --profile onprem config --quiet

      - name: Validate on-prem Compose profile with the egress proxy
        run: docker compose --file infra/compose/compose.onprem.yaml --profile onprem --profile egress config --quiet

      - name: Validate optional Neo4j overlay
        run: >-
          docker compose
          --file infra/compose/compose.onprem.yaml
          --file infra/compose/compose.neo4j.yaml
          --profile onprem
          --profile neo4j
          config --quiet

      - name: Validate cloud Compose profile
        env:
          # Production cloud needs TLS on every hop (HOM-161, docs/security/transport-policy.md).
          DATABASE_URL: postgresql+psycopg://homayar:ci-only@db.example.invalid:5432/homayar?sslmode=verify-full
          REDIS_URL: rediss://:ci-only@redis.example.invalid:6380/0?ssl_cert_reqs=required
        run: docker compose --file infra/compose/compose.cloud.yaml --profile cloud config --quiet

      - name: Validate cloud Compose profile with Neo4j
        env:
          # Production cloud needs TLS on every hop (HOM-161, docs/security/transport-policy.md).
          DATABASE_URL: postgresql+psycopg://homayar:ci-only@db.example.invalid:5432/homayar?sslmode=verify-full
          REDIS_URL: rediss://:ci-only@redis.example.invalid:6380/0?ssl_cert_reqs=required
        run: >-
          docker compose
          --file infra/compose/compose.cloud.yaml
          --file infra/compose/compose.neo4j.yaml
          --profile cloud
          --profile neo4j
          config --quiet

      - name: Smoke-test optional Neo4j health
        run: |
          set -Eeuo pipefail
          compose=(
            docker compose
            --project-name homayar-ci-neo4j
            --file infra/compose/compose.cloud.yaml
            --file infra/compose/compose.neo4j.yaml
            --profile neo4j
          )
          cleanup() {
            "${compose[@]}" down --volumes --remove-orphans >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          "${compose[@]}" up --detach --wait --wait-timeout 180 neo4j

      - name: Validate Dockerfile build definitions
        run: |
          docker buildx build --check --file infra/docker/public-web.Dockerfile .
          docker buildx build --check --file infra/docker/console-web.Dockerfile .
          docker buildx build --check --file infra/docker/api.Dockerfile .
          docker buildx build --check --file infra/docker/egress-proxy.Dockerfile .

      - name: Build application images
        run: |
          docker build --file infra/docker/public-web.Dockerfile --tag homayar-ci/public-web:local .
          docker build --file infra/docker/console-web.Dockerfile --tag homayar-ci/console-web:local .
          docker build --file infra/docker/api.Dockerfile --tag homayar-ci/api:local .
          docker build --file infra/docker/egress-proxy.Dockerfile --tag homayar-ci/egress-proxy:local .

      - name: Smoke-test hardened image runtimes
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker rm --force homayar-ci-public homayar-ci-console homayar-ci-api >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name homayar-ci-public \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --tmpfs /app/.next/cache:rw,noexec,nosuid,size=256m \
            --publish 127.0.0.1:3100:3000 homayar-ci/public-web:local
          docker run --detach --name homayar-ci-console \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            --publish 127.0.0.1:3180:8080 homayar-ci/console-web:local
          docker run --detach --name homayar-ci-api \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --tmpfs /app/logs:rw,noexec,nosuid,size=32m \
            --env ENVIRONMENT=development \
            --env DEPLOYMENT_MODE=onprem \
            --env DATABASE_URL=sqlite:////tmp/homayar-ci.db \
            --env AUTO_CREATE_SCHEMA=true \
            --publish 127.0.0.1:3800:8000 homayar-ci/api:local
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:3100/ >/dev/null
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:3180/app/index.html >/dev/null
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:3800/healthz >/dev/null
          test "$(docker inspect --format '{{.Config.User}}' homayar-ci-public)" = "10001:10001"
          test "$(docker inspect --format '{{.Config.User}}' homayar-ci-console)" = "101:101"
          test "$(docker inspect --format '{{.Config.User}}' homayar-ci-api)" = "10001:10001"

      # WP08-T06 network layer (ADR 0031): probes from inside the api, worker,
      # scheduler and web containers as Compose attaches them; disposable
      # endpoints only, no provider is contacted.
      - name: Test network-level egress denial and the egress proxy allowlist
        env:
          API_IMAGE: homayar-ci/api:local
          PUBLIC_WEB_IMAGE: homayar-ci/public-web:local
          CONSOLE_WEB_IMAGE: homayar-ci/console-web:local
          EGRESS_PROXY_IMAGE: homayar-ci/egress-proxy:local
        run: bash infra/egress/tests/test-egress-network.sh

      # The air-gapped gate: a private-only on-prem AI configuration passes the
      # preflight's --require-no-cloud check and a cloud endpoint is refused.
      - name: Check the air-gapped egress gate of the model preflight
        run: >-
          docker run --rm
          --volume "${PWD}/infra/ci/airgap_egress_check.py:/check/airgap_egress_check.py:ro"
          homayar-ci/api:local
          python /check/airgap_egress_check.py

      - name: Validate reverse-proxy nginx configuration
        run: >-
          docker run --rm
          --user 101:101
          --tmpfs /tmp
          --volume "${PWD}/infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro"
          --volume "${PWD}/infra/nginx/conf.d/homayar.conf:/etc/nginx/conf.d/default.conf:ro"
          --volume "${PWD}/infra/nginx/includes:/etc/nginx/includes:ro"
          --entrypoint nginx
          nginx:1.28-alpine
          -t

      - name: Validate console nginx configuration
        run: >-
          docker run --rm
          --user 101:101
          --tmpfs /tmp
          --volume "${PWD}/infra/nginx/console.conf:/etc/nginx/nginx.conf:ro"
          --entrypoint nginx
          nginx:1.28-alpine
          -t

      - name: Lint shell scripts
        run: >-
          docker run --rm
          --entrypoint shellcheck
          --volume "${PWD}:/work:ro"
          --workdir /work
          koalaman/shellcheck-alpine:v0.10.0
          --severity=warning
          infra/ci/check-migrations.sh
          infra/ci/check-source-contract.sh
          infra/ci/tests/test-check-source-contract.sh
          infra/scripts/backup-postgres.sh
          infra/scripts/restore-postgres.sh
          infra/scripts/backup-minio.sh
          infra/scripts/restore-minio.sh
          infra/scripts/lib/compose.sh
          infra/egress/entrypoint.sh
          infra/egress/tests/test-egress-network.sh

      - name: Lint Dockerfile templates
        run: >-
          docker run --rm
          --entrypoint hadolint
          --volume "${PWD}:/work:ro"
          --workdir /work
          hadolint/hadolint:v2.12.0-alpine
          infra/docker/public-web.Dockerfile
          infra/docker/console-web.Dockerfile
          infra/docker/api.Dockerfile
          infra/docker/egress-proxy.Dockerfile

  # HOM-28/HOM-29 (ADR 0036 decision 5): the manifest of this commit is reproducible, the API
  # image built from it carries the same identity, and the manifest is kept as an artifact.
  release-manifest:
    name: Release manifest and build identity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: source-contract
    env:
      SOURCE_SHA: "${{ github.sha }}"
    steps:
      - name: Check out full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # The manifest reads every input from Git objects at the commit.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "${{ env.PYTHON_VERSION }}"

      - name: Generate the release manifest twice and compare
        run: |
          set -Eeuo pipefail
          mkdir -p "${RUNNER_TEMP}/release"
          python infra/release/release_manifest.py generate --rev "${SOURCE_SHA}" --output "${RUNNER_TEMP}/release/first.json"
          python infra/release/release_manifest.py generate --rev "${SOURCE_SHA}" --output "${RUNNER_TEMP}/release/second.json"
          cmp "${RUNNER_TEMP}/release/first.json" "${RUNNER_TEMP}/release/second.json"

      - name: Build the API image with release arguments
        run: |
          set -Eeuo pipefail
          python infra/release/release_manifest.py build-args --rev "${SOURCE_SHA}" --output "${RUNNER_TEMP}/release/build-args.txt"
          cat "${RUNNER_TEMP}/release/build-args.txt"
          grep --quiet --line-regexp "SOURCE_SHA=${SOURCE_SHA}" "${RUNNER_TEMP}/release/build-args.txt"
          grep --quiet --line-regexp "SOURCE_DATE_EPOCH=$(git show --no-patch --format=%ct "${SOURCE_SHA}")" "${RUNNER_TEMP}/release/build-args.txt"
          build_args=()
          while IFS= read -r build_arg; do
            build_args+=(--build-arg "${build_arg}")
          done < "${RUNNER_TEMP}/release/build-args.txt"
          docker build --file infra/docker/api.Dockerfile "${build_args[@]}" --tag homayar-ci/api:release .

      - name: Verify the image against the manifest
        env:
          RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          set -Eeuo pipefail
          container="$(docker create homayar-ci/api:release)"
          docker cp "${container}:/app/build-info.json" "${RUNNER_TEMP}/release/build-info.json"
          docker rm "${container}" >/dev/null
          docker inspect --format '{{json .Config.Labels}}' homayar-ci/api:release > "${RUNNER_TEMP}/release/image-labels.json"
          image_id="$(docker inspect --format '{{.Id}}' homayar-ci/api:release)"
          python infra/release/release_manifest.py generate --rev "${SOURCE_SHA}" \
            --image "api=${image_id}" --validation "ci=${RUN_URL}" \
            --output "${RUNNER_TEMP}/release/release-manifest.json"
          python infra/release/release_manifest.py verify \
            --manifest "${RUNNER_TEMP}/release/release-manifest.json" \
            --build-info "${RUNNER_TEMP}/release/build-info.json" \
            --image-labels "${RUNNER_TEMP}/release/image-labels.json"

      - name: Read the build identity from the running API
        run: |
          set -Eeuo pipefail
          cleanup() {
            docker rm --force homayar-ci-release-api >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name homayar-ci-release-api \
            --read-only --tmpfs /tmp:rw,noexec,nosuid,size=128m \
            --tmpfs /app/logs:rw,noexec,nosuid,size=32m \
            --env ENVIRONMENT=development \
            --env DEPLOYMENT_MODE=onprem \
            --env DATABASE_URL=sqlite:////tmp/homayar-ci.db \
            --env AUTO_CREATE_SCHEMA=true \
            --publish 127.0.0.1:3801:8000 homayar-ci/api:release
          curl --fail --silent --show-error --retry 30 --retry-all-errors --retry-delay 1 http://127.0.0.1:3801/healthz >/dev/null
          curl --fail --silent --show-error http://127.0.0.1:3801/metrics > "${RUNNER_TEMP}/release/metrics.txt"
          grep '^homayar_build_info{' "${RUNNER_TEMP}/release/metrics.txt"
          grep '^homayar_build_info{' "${RUNNER_TEMP}/release/metrics.txt" | grep --quiet --fixed-strings "source_sha=\"${SOURCE_SHA}\""
          docker exec homayar-ci-release-api python -m backend.observability.release show

      - name: Upload the release manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-manifest
          path: |
            ${{ runner.temp }}/release/release-manifest.json
            ${{ runner.temp }}/release/build-info.json
            ${{ runner.temp }}/release/image-labels.json
            ${{ runner.temp }}/release/build-args.txt
          if-no-files-found: error
          retention-days: 90
