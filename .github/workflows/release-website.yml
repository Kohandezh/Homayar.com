name: Release website

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag, or commit SHA to release
        required: false
        type: string
        default: main

permissions:
  contents: read

# The build, deploy and smoke test live in deploy-website.yml, shared with the
# automatic deploy. Do not add the concurrency group deploy-website here: a caller
# and its called job in one group deadlock, and GitHub cancels the run.
jobs:
  release:
    name: Release
    permissions:
      contents: read
    uses: ./.github/workflows/deploy-website.yml
    with:
      ref: ${{ inputs.ref }}
    secrets: inherit
