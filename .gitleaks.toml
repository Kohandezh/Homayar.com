# Gitleaks configuration for the CI secret scan (`gitleaks git` reads this file
# from the repository root). The default rules stay in force; each allowlist
# below is limited to specific paths and to one value shape (content digests,
# test fixture keys and placeholder values, dialect labels, environment-variable
# names, Alembic revision ids), never a secret-shaped value.

[extend]
useDefault = true

[[allowlists]]
description = """Handoff source manifests map a repository path to its SHA-256 content \
digest. Paths such as backend/routers/v1/api_keys.py make the generic-api-key rule \
read the digest as a key; a 64-hex digest line in these files is not a secret."""
condition = "AND"
paths = [
  '''^docs/handoff/[^/]+/(CONTEXT_SNAPSHOT\.json|graphify/(refreshes/[^/]+/)?source-manifest\.json)$''',
]
regexTarget = "line"
regexes = [
  '''^\s*"[^"]+":\s*"[0-9a-f]{64}",?\s*$''',
]

[[allowlists]]
description = """Product test fixtures (ADR 0033 import): idempotency and fixture keys \
written as lowercase words and digits joined by hyphens (key="purge-exhaust-0001"), keys \
named after a Linear issue ("hom120-evidence"), the keyword text itself when a call \
continues with another argument (idempotency_key=), and environment-variable names \
(HOMAYAR_LIVE_S3_SECRET_KEY). The generic-api-key rule reads them as values."""
condition = "AND"
paths = [
  '''^Homayar/backend/tests/[^/]+\.py$''',
]
regexTarget = "secret"
regexes = [
  '''^[a-z]+(?:-[a-z0-9]+)+$''',
  '''^hom[0-9]{1,4}(?:-[a-z]+)+$''',
  '''^[a-z_]+=$''',
  '''^HOMAYAR_[A-Z0-9_]+$''',
]

[[allowlists]]
description = """Text-normalization owner tests (HOM-172) pin base source code to SHA-256 \
digests, as in the saved wp22t02 handoff: each line maps a line-range name (_AUTH_616_618) \
or a file path (backend/schemas/auth.py) to 64 lowercase hex characters, or a function \
name to a 24-character digest prefix. The whole line must have this shape, so a key \
assigned on any other line is still reported."""
condition = "AND"
paths = [
  '''^Homayar/backend/tests/(_text_normalization_reference|test_text_normalization_owner)\.py$''',
]
regexTarget = "line"
regexes = [
  '''^\s*"(_[A-Z]+_[0-9]+_[0-9]+|[A-Za-z0-9_./-]+\.py)":\s*"[0-9a-f]{64}",?\s*$''',
  '''^\s*\("[a-z_]+",\s*"[0-9a-f]{24}"\),?\s*$''',
]

[[allowlists]]
description = """Product records cite Alembic revision ids (12 lowercase hex characters) \
next to words such as "tokens"; a revision id is not a secret."""
condition = "AND"
paths = [
  '''^Homayar/docs/.+\.md$''',
]
regexTarget = "secret"
regexes = [
  '''^[0-9a-f]{12}$''',
]

[[allowlists]]
description = """Handoff test oracle (n11): fake legacy environment values written as \
short lowercase words and digits joined by hyphens (legacy-voip-secret-n11-4d1f). Each \
part is at most 12 characters, so a long random key such as sk-<hex> is still reported."""
condition = "AND"
paths = [
  '''^docs/handoff/session-reset/backend-mode-100-linear/20260929-backend-mode-100/n11-t1/test_oracle_n11\.py$''',
]
regexTarget = "secret"
regexes = [
  '''^[a-z]{2,12}(?:-[a-z0-9]{1,12}){2,}$''',
]

[[allowlists]]
description = """Speech benchmark test: slice keys name a dialect with a language tag \
(slice_key="dialect=fa-AF"). The generic-api-key rule reads the label as a key."""
condition = "AND"
paths = [
  '''^Homayar/backend/tests/test_speech_benchmark\.py$''',
]
regexTarget = "secret"
regexes = [
  '''^dialect=[a-z]{2,3}(?:-[A-Z]{2})?$''',
]

[[allowlists]]
description = """Saved WIP handoff (wp22t02): the maker patch and the test oracle pin \
source code to SHA-256 digests. Each line maps a line-range name (_AUTH_616_618) or a \
file path (backend/schemas/auth.py) to 64 lowercase hex characters, or a function name \
to a 24-character digest prefix. The whole line must have this shape, so a key assigned \
on any other line is still reported."""
condition = "AND"
paths = [
  '''^docs/handoff/session-reset/backend-mode-100-linear/20260929-backend-mode-100/wip/wp22t02-t1/(maker-wip\.patch|test_oracle_wp22t02\.py)$''',
]
regexTarget = "line"
regexes = [
  '''^\s*\+?\s*"(_[A-Z]+_[0-9]+_[0-9]+|[A-Za-z0-9_./-]+\.py)":\s*"[0-9a-f]{64}",?\s*$''',
  '''^\s*\("[a-z_]+",\s*"[0-9a-f]{24}"\),?\s*$''',
]
