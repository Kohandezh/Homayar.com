# Triage ignore rules for the Security scans workflow (HOM-130).
# infra/ci/security-scan.sh passes this file to Grype on every scan.
#
# Each rule names exactly one vulnerability ID and one package name, so the
# same ID in another package still fails the gate. Grype matches the whole
# package name, so `zod` does not match `zod-validation-error`.
# Each rule has a comment: the row of docs/security/vulnerability-triage.md,
# the decision and a short reason. The full evidence is in that row.
# Add a rule only together with its row.
# A rule that matches nothing in the current scan must be removed together with
# its row, or it would hide the finding without a new review if the package or an
# old version came back. The `Unused ignore rules` job of the Security scans
# workflow (security-scan.sh unused-rules) fails on such a rule.
ignore:
  # F055 accepted: not reachable: dev only; not in the image or the Worker
  - vulnerability: GHSA-2m5v-pch6-74hx
    package:
      name: undici
  # F056 accepted: not reachable: dev only; not in the image or the Worker
