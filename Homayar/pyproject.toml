[project]
name = "homayar-platform"
version = "0.5.0"
description = "Homayar multi-tenant conversation intelligence platform"
requires-python = ">=3.12,<3.14"
dependencies = [
  "alembic==1.16.5",
  "authlib==1.6.4",
  "boto3==1.40.30",
  "celery[redis]==5.5.3",
  "email-validator==2.3.0",
  "fastapi==0.116.1",
  "filetype==1.2.0",
  "google-auth[requests]==2.40.3",
  "httpx==0.28.1",
  "neo4j==5.28.2",
  "prometheus-client==0.22.1",
  "psycopg[binary]==3.2.10",
  "pydantic==2.11.9",
  "pydantic-settings==2.10.1",
  "pwdlib[argon2]==0.2.1",
  "pyjwt[crypto]==2.10.1",
  "python-multipart==0.0.20",
  "redis==5.2.1",
  "reportlab==4.4.3",
  "sqlalchemy==2.0.43",
  "structlog==25.4.0",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
ai-local = ["faster-whisper==1.2.0"]
ldap = ["ldap3==2.9.1"]
persian-export = ["arabic-reshaper==3.0.0", "python-bidi==0.6.6"]

[dependency-groups]
dev = [
  "freezegun==1.5.5",
  "mypy==1.18.1",
  "pytest==8.4.2",
  "pytest-asyncio==1.2.0",
  "pytest-cov==7.0.0",
  "respx==0.22.0",
  "ruff==0.13.0",
]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = [".", "sdk/python"]
addopts = "--strict-markers --disable-warnings"
markers = [
  "postgres: exercises a PostgreSQL-only guarantee; skipped unless TEST_DATABASE_URL is set",
  "redis: drives the real Redis/Celery transport; skipped unless TEST_REDIS_URL is set",
  "ffmpeg: needs the ffprobe and ffmpeg binaries on PATH; skipped when they are missing",
  "live_s3: mutates a designated disposable S3-compatible bucket; skipped unless HOMAYAR_LIVE_S3_TEST=1 and the HOMAYAR_LIVE_S3_* target is configured",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["sample", "frontend", "graphify-out"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["B008", "S101"]

[tool.ruff.lint.per-file-ignores]
"backend/migrations/versions/*.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
exclude = "^(sample|frontend|graphify-out)/"
warn_unused_ignores = true
check_untyped_defs = true
