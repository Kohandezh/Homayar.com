[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "homayar-client"
version = "1.0.0"
description = "Minimal client for the Homayar ingestion API (OpenAPI contract v1)"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[tool.setuptools]
packages = ["homayar_client"]
