name: homayar-cloud

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-environment: &app-environment
  ENVIRONMENT: production
  DEPLOYMENT_MODE: cloud
  APP_NAME: Homayar
  API_PREFIX: /api/v1
  PUBLIC_URL: "${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN, without a trailing slash}"
  FRONTEND_URL: "${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN, without a trailing slash}/app"
  CORS_ORIGINS: "${CORS_ORIGINS:?Set the exact comma-separated browser origins}"
  TRUSTED_HOSTS: "${TRUSTED_HOSTS:?Set the exact comma-separated HTTP hostnames}"
  DATABASE_URL: "${DATABASE_URL:?Set the managed PostgreSQL DSN}"
  # Row-level security (WP03-T05): the runtime must not be a superuser/BYPASSRLS
  # role. Either DATABASE_URL logs in as a member of homayar_app (set this empty)
  # or it logs in as the migration owner and switches with SET ROLE (default).
  DATABASE_APP_ROLE: "${DATABASE_APP_ROLE-homayar_app}"
  DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-10}"
  DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-20}"
  REDIS_URL: "${REDIS_URL:?Set the TLS-enabled managed Redis DSN}"
  JWT_SECRET: "${JWT_SECRET:?Set a random JWT secret of at least 32 characters}"
  TOKEN_PEPPER: "${TOKEN_PEPPER:?Set an independent random token pepper of at least 32 characters}"
  JWT_ISSUER: "${JWT_ISSUER:-homayar}"
  JWT_AUDIENCE: "${JWT_AUDIENCE:-homayar-api}"
  SECURE_COOKIES: "true"
  COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
  AUTO_CREATE_SCHEMA: "false"
  ENABLE_DEMO_ACCOUNT: "false"
  ALLOW_MOCK_PROVIDERS: "false"
  TASKS_EAGER: "false"
  RATE_LIMIT_FAIL_OPEN: "false"
  STORAGE_BACKEND: s3
  STORAGE_BUCKET: "${STORAGE_BUCKET:?Set the private object-storage bucket}"
  STORAGE_ENDPOINT_URL: "${STORAGE_ENDPOINT_URL:-}"
  STORAGE_REGION: "${STORAGE_REGION:?Set the object-storage region}"
  STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY:?Set the object-storage access key}"
  STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY:?Set the object-storage secret key}"
  STORAGE_LOCAL_ROOT: /app/data/objects
  UPLOAD_DIR: /app/data/legacy-uploads
  UPLOAD_QUARANTINE_DIR: /app/data/quarantine
  # Tombstone journal (WP07-T04, ADR 0022): kept OUTSIDE the database and
  # object-store backups so a restore can reapply later deletions. Bind
  # TOMBSTONE_JOURNAL_PATH to a separately replicated mount in production.
  TOMBSTONE_JOURNAL_DIR: /app/tombstones
  ENABLE_NEO4J_PROJECTION: "false"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  # Prometheus /metrics on the API port (HOM-113, docs/operations/observability.md).
  # Production needs METRICS_BEARER_TOKEN (>= 32 characters); without it /metrics
  # answers 404. Cloud has no unauthenticated opt-out (METRICS_ALLOW_UNAUTHENTICATED).
  METRICS_ENABLED: "${METRICS_ENABLED:-true}"
  METRICS_BEARER_TOKEN: "${METRICS_BEARER_TOKEN:-}"
  METRICS_CACHE_SECONDS: "${METRICS_CACHE_SECONDS:-15}"
  # Model registry and provider resilience (WP08, ADR 0026/0030). Leave
  # MODEL_MANIFEST_STRICT unset: strict by default outside development/test.
  MODEL_MANIFEST_PATHS: "${MODEL_MANIFEST_PATHS:-}"
  MODEL_MANIFEST_PINS: "${MODEL_MANIFEST_PINS:-}"
  JOB_RETRY_JITTER_RATIO: "${JOB_RETRY_JITTER_RATIO:-0.1}"
  PROVIDER_CIRCUIT_FAILURE_THRESHOLD: "${PROVIDER_CIRCUIT_FAILURE_THRESHOLD:-5}"
  PROVIDER_CIRCUIT_COOLDOWN_SECONDS: "${PROVIDER_CIRCUIT_COOLDOWN_SECONDS:-60}"
  PROVIDER_RATE_LIMITS: "${PROVIDER_RATE_LIMITS:-}"
  LLM_FALLBACK_BASE_URL: "${LLM_FALLBACK_BASE_URL:-}"
  LLM_FALLBACK_MODEL: "${LLM_FALLBACK_MODEL:-}"
  LLM_FALLBACK_API_KEY: "${LLM_FALLBACK_API_KEY:-}"
  # AI providers (ADR 0028/0029). The Padyar AI Gateway has no API contract
  # yet: selecting it fails jobs with provider_contract_unavailable.
  ASR_PROVIDER: "${ASR_PROVIDER:-local_whisper}"
  DIARIZATION_PROVIDER: "${DIARIZATION_PROVIDER:-unavailable}"
  INTELLIGENCE_PROVIDER: "${INTELLIGENCE_PROVIDER:-openai_compatible}"
  LOCAL_AI_BASE_URL: "${LOCAL_AI_BASE_URL:-}"
  WHISPER_MODEL: "${WHISPER_MODEL:-base}"
  WHISPER_DEVICE: "${WHISPER_DEVICE:-cpu}"
  WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
  # Named Whisper profile and language policy (HOM-39, ADR 0044). An empty
  # profile keeps the WHISPER_* values above.
  ASR_PROFILE: "${ASR_PROFILE:-}"
  ASR_ALLOWED_LANGUAGES: "${ASR_ALLOWED_LANGUAGES:-fa,en}"
  ASR_DEFAULT_LANGUAGE: "${ASR_DEFAULT_LANGUAGE:-fa}"
  ASR_LANGUAGE_MIN_PROBABILITY: "${ASR_LANGUAGE_MIN_PROBABILITY:-0.5}"
  # Long-call chunking (HOM-40, ADR 0046): a call longer than the threshold is
  # transcribed in chunks; false sends every call as one request.
  ASR_CHUNKING_ENABLED: "${ASR_CHUNKING_ENABLED:-True}"
  ASR_CHUNK_MIN_CALL_SECONDS: "${ASR_CHUNK_MIN_CALL_SECONDS:-1200.0}"
  ASR_CHUNK_TARGET_SECONDS: "${ASR_CHUNK_TARGET_SECONDS:-600.0}"
  ASR_CHUNK_SEARCH_SECONDS: "${ASR_CHUNK_SEARCH_SECONDS:-30.0}"
  ASR_CHUNK_OVERLAP_SECONDS: "${ASR_CHUNK_OVERLAP_SECONDS:-2.0}"
  # Restricted PII mappings (ADR 0023): "key_id:base64(32 bytes)" from the
  # secret manager; empty keeps redaction but retains no originals.
  PII_MAPPING_KEYS: "${PII_MAPPING_KEYS:-}"
  PII_MAPPING_ACTIVE_KEY_ID: "${PII_MAPPING_ACTIVE_KEY_ID:-}"
  # Webhook signing secrets at rest (ADR 0050): same keyring format, from the
  # secret manager; empty refuses new webhook endpoints (503).
  WEBHOOK_SECRET_KEYS: "${WEBHOOK_SECRET_KEYS:-}"
  WEBHOOK_SECRET_ACTIVE_KEY_ID: "${WEBHOOK_SECRET_ACTIVE_KEY_ID:-}"
  # Sign-in and delivery providers: disabled unless configured. The API
  # refuses to start with a method enabled but its credentials missing, and
  # GET /api/v1/auth/methods tells the console what is available.
  ENABLE_GOOGLE_AUTH: "${ENABLE_GOOGLE_AUTH:-false}"
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
  GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
  GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
  ENABLE_PHONE_AUTH: "${ENABLE_PHONE_AUTH:-false}"
  ASANAK_API_KEY: "${ASANAK_API_KEY:-}"
  ASANAK_SENDER: "${ASANAK_SENDER:-}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USERNAME: "${SMTP_USERNAME:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
  SMTP_FROM: "${SMTP_FROM:-noreply@homayar.com}"
  SMTP_USE_TLS: "${SMTP_USE_TLS:-false}"
  ENABLE_FREE_DEMO: "${ENABLE_FREE_DEMO:-true}"
  REGISTRATION_ENABLED: "${REGISTRATION_ENABLED:-true}"
  DEMO_QUOTA_SECONDS: "${DEMO_QUOTA_SECONDS:-1800}"
  # Outbound HTTP(S) through an approved egress proxy when one is provided
  # (EGRESS_PROXY_URL). In this profile PostgreSQL, Redis and object storage
  # are external, so network-level egress control must be enforced by the
  # platform firewall / security groups (see the deployment runbook).
  HTTP_PROXY: "${EGRESS_PROXY_URL:-}"
  HTTPS_PROXY: "${EGRESS_PROXY_URL:-}"
  NO_PROXY: "${EGRESS_NO_PROXY:-localhost,127.0.0.1}"

services:
  proxy:
    image: "${NGINX_IMAGE:-nginx:1.30-alpine-slim@sha256:dede8895648b461178c3bc604f7eed4423efe5220b2c4d839f5eb3d34ac3f8f7}"
    profiles: [cloud]
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/homayar.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/includes:/etc/nginx/includes:ro
    depends_on:
      console-web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    logging: *default-logging

  console-web:
    image: "${CONSOLE_WEB_IMAGE:?Set an immutable console-web image reference}"
    profiles: [cloud]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/app/index.html]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    logging: *default-logging

  api:
    image: "${API_IMAGE:?Set an immutable API image reference}"
    profiles: [cloud]
    command:
      - /bin/sh
      - -ec
      - exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers "$${UVICORN_WORKERS}"
    environment:
      <<: *app-environment
      UVICORN_WORKERS: "${UVICORN_WORKERS:-2}"
      # Counters of all uvicorn workers in one tmpfs directory (empty at every
      # container start): /metrics sums them instead of answering per worker.
      # Its own small tmpfs, so upload spooling in /tmp can never fill it.
      PROMETHEUS_MULTIPROC_DIR: /run/homayar-metrics
    volumes:
      - app_data:/app/data
      - "${TOMBSTONE_JOURNAL_PATH:-tombstone_journal}:/app/tombstones"
      - "${MODEL_MANIFEST_DIR:-../manifests}:/app/manifests:ro"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    read_only: true
    # uid/gid/mode: the image user (10001, infra/docker/api.Dockerfile) must own these.
    # Without them runc gives a tmpfs the mode of an existing mount point, owned by
    # root: after a restart /run/homayar-metrics was root 755 and every uvicorn
    # worker died on its metrics file. /tmp keeps the image's 1777.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /app/logs:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700
      - /run/homayar-metrics:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge, private]
    logging: *default-logging

  # Transactional-outbox recovery (WP06-T02): one beat instance republishes
  # dispatch rows left PENDING by a crash between commit and publication.
  # Run exactly one replica; concurrent sweeps are safe (SKIP LOCKED) but wasteful.
  scheduler:
    image: "${API_IMAGE:?Set an immutable API image reference}"
    profiles: [cloud]
    command:
      - /bin/sh
      - -ec
      - exec celery -A backend.celery_app beat --loglevel="$${LOG_LEVEL}" --schedule=/app/data/celerybeat-schedule
    environment:
      <<: *app-environment
    volumes:
      - app_data:/app/data
      - "${MODEL_MANIFEST_DIR:-../manifests}:/app/manifests:ro"
    restart: unless-stopped
    networks: [private]
    logging: *default-logging

  worker:
    image: "${API_IMAGE:?Set an immutable API image reference}"
    profiles: [cloud]
    command:
      - /bin/sh
      - -ec
      - exec celery -A backend.celery_app worker --queues processing --loglevel="$${LOG_LEVEL}" --concurrency="$${CELERY_CONCURRENCY}" --hostname="celery@%h"
    environment:
      <<: *app-environment
      CELERY_CONCURRENCY: "${CELERY_CONCURRENCY:-2}"
    volumes:
      - app_data:/app/data
      - "${TOMBSTONE_JOURNAL_PATH:-tombstone_journal}:/app/tombstones"
      - "${MODEL_MANIFEST_DIR:-../manifests}:/app/manifests:ro"
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A backend.celery_app inspect ping --destination "celery@$$HOSTNAME" --timeout 5 | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    stop_grace_period: 2m
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
      # Owned by the image user 10001, as on the api (see there).
      - /app/logs:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [private]
    logging: *default-logging

  migrate:
    image: "${API_IMAGE:?Set an immutable API image reference}"
    profiles: [migrate]
    command:
      - /bin/sh
      - -ec
      - >-
        test -f alembic.ini || { echo '/app/alembic.ini is required' >&2; exit 2; };
        exec alembic -c alembic.ini upgrade head
    environment: *app-environment
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [private]
    logging: *default-logging

volumes:
  app_data:
  tombstone_journal:

networks:
  edge:
  private:
