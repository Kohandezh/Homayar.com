services:
  api:
    environment:
      ENABLE_NEO4J_PROJECTION: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set a random Neo4j password}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    depends_on:
      neo4j:
        condition: service_healthy
    networks: [graph]

  worker:
    environment:
      ENABLE_NEO4J_PROJECTION: "true"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set a random Neo4j password}"
      NEO4J_DATABASE: "${NEO4J_DATABASE:-neo4j}"
    depends_on:
      neo4j:
        condition: service_healthy
    networks: [graph]

  neo4j:
    image: "${NEO4J_IMAGE:-neo4j:5.26-community}"
    profiles: [neo4j]
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set a random Neo4j password}"
      NEO4J_server_memory_pagecache_size: "${NEO4J_PAGECACHE_SIZE:-512M}"
      NEO4J_server_memory_heap_initial__size: "${NEO4J_HEAP_INITIAL_SIZE:-512M}"
      NEO4J_server_memory_heap_max__size: "${NEO4J_HEAP_MAX_SIZE:-1G}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          auth="$${NEO4J_AUTH}";
          cypher-shell -u "$${auth%%/*}" -p "$${auth#*/}" "RETURN 1;" >/dev/null
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    stop_grace_period: 1m
    security_opt: [no-new-privileges:true]
    networks: [graph]

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  graph:
    internal: true
