# The demo stack of demo.homayar.com (HOM-383). Runbook:
# docs/operations/demo-site.md. Use it INSTEAD of
# compose.onprem.app-server.yaml, on top of compose.onprem.yaml, with the
# project name fixed by infra/scripts/demo-site.sh:
#   docker compose --project-name homayar-demo \
#     --file infra/compose/compose.onprem.yaml \
#     --file infra/compose/compose.onprem.demo.yaml --profile onprem ...
# Like the app-server overlay it fixes memory and CPU limits, subnets and the
# trusted proxy, but for a second, smaller stack on the same host that shares
# nothing with production (homayar-onprem):
# 1. lower limits (the demo runs next to production and the Padyar services);
# 2. its own five subnets, 172.29.30.0/24 to 172.29.34.0/24, so no project
#    network can overlap production (172.29.10.0/24 to 172.29.14.0/24), the
#    LAN, a VPN route or another Docker bridge, and the trusted proxy
#    addresses below are known;
# 3. the only published port is 127.0.0.1:8090 (!override, whatever
#    BIND_ADDRESS and HTTP_PORT in the env files say); the host nginx site
#    demo.homayar.com proxies https://demo.homayar.com:8080 to it;
# 4. trust of the host TLS front: the proxy takes the client IP from the
#    X-Real-IP header of the demo edge gateway 172.29.30.1
#    (infra/nginx/trusted-proxy/demo-host-tls-front.conf) and the API takes
#    it from the proxy at its fixed ingress address 172.29.31.10.
# Memory limits include the tmpfs mounts of each service. memswap_limit
# equals mem_limit, so the container never swaps. API_MEM_LIMIT is the one
# knob demo-site.sh raises, for the demo seed one-shot run (1536m).

services:
  proxy:
    mem_limit: "${PROXY_MEM_LIMIT:-128m}"
    memswap_limit: "${PROXY_MEM_LIMIT:-128m}"
    cpus: "${PROXY_CPUS:-2}"
    ports: !override
      - "127.0.0.1:8090:8080"
    volumes:
      # Keep this address in step with the edge gateway below.
      - ../nginx/trusted-proxy/demo-host-tls-front.conf:/etc/nginx/conf.d/00-trusted-proxy.conf:ro
    networks:
      edge: {}
      ingress:
        ipv4_address: 172.29.31.10

  console-web:
    mem_limit: "${CONSOLE_WEB_MEM_LIMIT:-128m}"
    memswap_limit: "${CONSOLE_WEB_MEM_LIMIT:-128m}"
    cpus: "${CONSOLE_WEB_CPUS:-1}"

  api:
    mem_limit: "${API_MEM_LIMIT:-768m}"
    memswap_limit: "${API_MEM_LIMIT:-768m}"
    cpus: "${API_CPUS:-2}"
    environment:
      # uvicorn trusts X-Forwarded-For only from the proxy's fixed address.
      FORWARDED_ALLOW_IPS: 172.29.31.10

  scheduler:
    mem_limit: "${SCHEDULER_MEM_LIMIT:-256m}"
    memswap_limit: "${SCHEDULER_MEM_LIMIT:-256m}"
    cpus: "${SCHEDULER_CPUS:-0.5}"

  worker:
    mem_limit: "${WORKER_MEM_LIMIT:-768m}"
    memswap_limit: "${WORKER_MEM_LIMIT:-768m}"
    cpus: "${WORKER_CPUS:-2}"

  postgres:
    mem_limit: "${POSTGRES_MEM_LIMIT:-512m}"
    memswap_limit: "${POSTGRES_MEM_LIMIT:-512m}"
    cpus: "${POSTGRES_CPUS:-2}"

  redis:
    mem_limit: "${REDIS_MEM_LIMIT:-128m}"
    memswap_limit: "${REDIS_MEM_LIMIT:-128m}"
    cpus: "${REDIS_CPUS:-1}"

  minio:
    mem_limit: "${MINIO_MEM_LIMIT:-512m}"
    memswap_limit: "${MINIO_MEM_LIMIT:-512m}"
    cpus: "${MINIO_CPUS:-2}"

  minio-bootstrap:
    # One-shot. mc needs about 150 MiB; 128m was OOM-killed in production.
    mem_limit: 256m
    memswap_limit: 256m

  egress-proxy:
    mem_limit: "${EGRESS_PROXY_MEM_LIMIT:-128m}"
    memswap_limit: "${EGRESS_PROXY_MEM_LIMIT:-128m}"
    cpus: "${EGRESS_PROXY_CPUS:-1}"

  migrate:
    mem_limit: 768m
    memswap_limit: 768m
    environment:
      # The migration owner. The API, worker and scheduler log in as
      # homayar_api, a member of homayar_app (DATABASE_URL, with
      # DATABASE_APP_ROLE empty).
      DATABASE_URL: "${MIGRATION_DATABASE_URL:?Set the PostgreSQL DSN of the migration owner}"

networks:
  edge:
    ipam:
      config:
        - subnet: 172.29.30.0/24
          gateway: 172.29.30.1
  ingress:
    ipam:
      config:
        - subnet: 172.29.31.0/24
          # Dynamic addresses come only from .128 to .255, so no other
          # container can take the proxy's fixed .10 (the one address uvicorn
          # trusts).
          ip_range: 172.29.31.128/25
          gateway: 172.29.31.1
  backend:
    ipam:
      config:
        - subnet: 172.29.32.0/24
          gateway: 172.29.32.1
  egress:
    ipam:
      config:
        - subnet: 172.29.33.0/24
          gateway: 172.29.33.1
  outbound:
    ipam:
      config:
        - subnet: 172.29.34.0/24
          gateway: 172.29.34.1
