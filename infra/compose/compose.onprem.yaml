name: homayar-onprem

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-environment: &app-environment
  ENVIRONMENT: "${APP_ENVIRONMENT:-production}"
  DEPLOYMENT_MODE: onprem
  APP_NAME: Homayar
  API_PREFIX: /api/v1
  PUBLIC_URL: "${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN, without a trailing slash}"
  FRONTEND_URL: "${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN, without a trailing slash}/app"
  CORS_ORIGINS: "${CORS_ORIGINS:?Set the exact comma-separated browser origins}"
  TRUSTED_HOSTS: "${TRUSTED_HOSTS:?Set the exact comma-separated HTTP hostnames}"
  DATABASE_URL: "${DATABASE_URL:?Set a URL-encoded PostgreSQL DSN for the postgres service}"
  DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-10}"
  DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-20}"
  REDIS_URL: "${REDIS_URL:?Set a URL-encoded Redis DSN for the redis service}"
  JWT_SECRET: "${JWT_SECRET:?Set a random JWT secret of at least 32 characters}"
  TOKEN_PEPPER: "${TOKEN_PEPPER:?Set an independent random token pepper of at least 32 characters}"
  JWT_ISSUER: "${JWT_ISSUER:-homayar}"
  JWT_AUDIENCE: "${JWT_AUDIENCE:-homayar-api}"
  SECURE_COOKIES: "${SECURE_COOKIES:-true}"
  COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
  AUTO_CREATE_SCHEMA: "false"
  ENABLE_DEMO_ACCOUNT: "false"
  ALLOW_MOCK_PROVIDERS: "false"
  TASKS_EAGER: "false"
  RATE_LIMIT_FAIL_OPEN: "false"
  STORAGE_BACKEND: s3
  STORAGE_BUCKET: "${MINIO_BUCKET:-homayar-private}"
  STORAGE_ENDPOINT_URL: http://minio:9000
  STORAGE_REGION: "${STORAGE_REGION:-us-east-1}"
  STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY:?Set a dedicated MinIO application access key}"
  STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY:?Set a dedicated MinIO application secret key}"
  STORAGE_LOCAL_ROOT: /app/data/objects
  UPLOAD_DIR: /app/data/legacy-uploads
  UPLOAD_QUARANTINE_DIR: /app/data/quarantine
  ENABLE_NEO4J_PROJECTION: "false"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"

x-api-image: &api-image
  image: "${API_IMAGE:-homayar/api:local}"
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
    args:
      PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12-slim-bookworm}"
      UV_VERSION: "${UV_VERSION:-0.11.24}"
      INSTALL_AI_LOCAL: "${INSTALL_AI_LOCAL:-false}"

services:
  proxy:
    image: "${NGINX_IMAGE:-nginx:1.28-alpine}"
    profiles: [onprem]
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/homayar.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/includes:/etc/nginx/includes:ro
    depends_on:
      public-web:
        condition: service_healthy
      console-web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    logging: *default-logging

  public-web:
    image: "${PUBLIC_WEB_IMAGE:-homayar/public-web:local}"
    profiles: [onprem]
    build:
      context: ../..
      dockerfile: infra/docker/public-web.Dockerfile
      args:
        NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}"
        PNPM_VERSION: "${PNPM_VERSION:-11.1.2}"
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
      NEXT_TELEMETRY_DISABLED: "1"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/').then((r) => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
      - /app/.next/cache:rw,noexec,nosuid,size=512m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    logging: *default-logging

  console-web:
    image: "${CONSOLE_WEB_IMAGE:-homayar/console-web:local}"
    profiles: [onprem]
    build:
      context: ../..
      dockerfile: infra/docker/console-web.Dockerfile
      args:
        NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine}"
        NGINX_IMAGE: "${NGINX_IMAGE:-nginx:1.28-alpine}"
        VITE_API_URL: /api/v1
        VITE_BASE_PATH: /app/
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/app/index.html]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge]
    logging: *default-logging

  api:
    <<: *api-image
    profiles: [onprem]
    command:
      - /bin/sh
      - -ec
      - exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers "$${UVICORN_WORKERS}"
    environment:
      <<: *app-environment
      UVICORN_WORKERS: "${UVICORN_WORKERS:-2}"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /app/logs:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [edge, backend]
    logging: *default-logging

  worker:
    <<: *api-image
    profiles: [onprem]
    command:
      - /bin/sh
      - -ec
      - exec celery -A backend.celery_app worker --queues processing --loglevel="$${LOG_LEVEL}" --concurrency="$${CELERY_CONCURRENCY}" --hostname="celery@%h"
    environment:
      <<: *app-environment
      CELERY_CONCURRENCY: "${CELERY_CONCURRENCY:-2}"
    volumes:
      - app_data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A backend.celery_app inspect ping --destination "celery@$$HOSTNAME" --timeout 5 | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    stop_grace_period: 2m
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
      - /app/logs:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, egress]
    logging: *default-logging

  migrate:
    <<: *api-image
    profiles: [migrate]
    command:
      - /bin/sh
      - -ec
      - >-
        test -f alembic.ini || { echo '/app/alembic.ini is required' >&2; exit 2; };
        exec alembic -c alembic.ini upgrade head
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *default-logging

  postgres:
    image: "${POSTGRES_IMAGE:-postgres:17-alpine}"
    profiles: [onprem]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set the PostgreSQL database name}"
      POSTGRES_USER: "${POSTGRES_USER:?Set the PostgreSQL application role}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set a random PostgreSQL password}"
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(cat /proc/1/comm)" = postgres && pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: 256m
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *default-logging

  redis:
    image: "${REDIS_IMAGE:-redis:7.4-alpine}"
    profiles: [onprem]
    user: "${REDIS_UID:-999}:${REDIS_GID:-1000}"
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server --appendonly yes --appendfsync everysec
        --save 60 1 --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set a random Redis password}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *default-logging

  minio:
    image: "${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}"
    profiles: [onprem]
    command: [server, /data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set a random MinIO root access key}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set a random MinIO root secret key}"
    volumes:
      - minio_data:/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 1m
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *default-logging

  minio-bootstrap:
    image: "${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z}"
    profiles: [onprem]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mc alias set local "$$MINIO_ENDPOINT" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc version enable "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        printf '%s\n' \
          '{"Version":"2012-10-17","Statement":[' \
          '{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::'"$$MINIO_BUCKET"'"]},' \
          '{"Effect":"Allow","Action":["s3:AbortMultipartUpload","s3:DeleteObject","s3:GetObject","s3:ListMultipartUploadParts","s3:PutObject"],"Resource":["arn:aws:s3:::'"$$MINIO_BUCKET"'/*"]}' \
          ']}' > /tmp/homayar-app-policy.json
        mc admin policy create local homayar-app /tmp/homayar-app-policy.json ||
          mc admin policy update local homayar-app /tmp/homayar-app-policy.json
        mc admin user add local "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY"
        mc admin policy attach local homayar-app --user "$$STORAGE_ACCESS_KEY"
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: "${MINIO_BUCKET:-homayar-private}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set a random MinIO root access key}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set a random MinIO root secret key}"
      STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY:?Set a dedicated MinIO application access key}"
      STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY:?Set a dedicated MinIO application secret key}"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *default-logging

  minio-tools:
    image: "${MINIO_MC_IMAGE:-quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z}"
    profiles: [ops]
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    entrypoint: [/bin/sh, -ec]
    command: [mc --version]
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: "${MINIO_BUCKET:-homayar-private}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set a random MinIO root access key}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set a random MinIO root secret key}"
    volumes:
      - "${BACKUP_ROOT:-../backups}:/backups"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *default-logging

volumes:
  app_data:
  postgres_data:
  redis_data:
  minio_data:

networks:
  edge:
  backend:
    internal: true
  egress:
