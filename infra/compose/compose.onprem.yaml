name: homayar-onprem

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-app-environment: &app-environment
  ENVIRONMENT: "${APP_ENVIRONMENT:-production}"
  DEPLOYMENT_MODE: onprem
  APP_NAME: Homayar
  API_PREFIX: /api/v1
  PUBLIC_URL: "${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN, without a trailing slash}"
  FRONTEND_URL: "${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN, without a trailing slash}/app"
  CORS_ORIGINS: "${CORS_ORIGINS:?Set the exact comma-separated browser origins}"
  TRUSTED_HOSTS: "${TRUSTED_HOSTS:?Set the exact comma-separated HTTP hostnames}"
  DATABASE_URL: "${DATABASE_URL:?Set a URL-encoded PostgreSQL DSN for the postgres service}"
  # Production requires TLS on every internal hop (HOM-161). The bundled PostgreSQL,
  # Redis and MinIO have no certificates yet (HOM-196), so each hop opts out explicitly. The
  # opt-outs cover only same-host servers (these Compose services), are refused in
  # cloud mode, and are logged at startup as TRANSPORT_TLS_OPT_OUT.
  DATABASE_ALLOW_INSECURE_TRANSPORT: "true"
  # Row-level security (WP03-T05): the runtime must not be a superuser/BYPASSRLS
  # role. Either DATABASE_URL logs in as a member of homayar_app (set this empty)
  # or it logs in as the migration owner and switches with SET ROLE (default).
  DATABASE_APP_ROLE: "${DATABASE_APP_ROLE-homayar_app}"
  DATABASE_POOL_SIZE: "${DATABASE_POOL_SIZE:-10}"
  DATABASE_MAX_OVERFLOW: "${DATABASE_MAX_OVERFLOW:-20}"
  REDIS_URL: "${REDIS_URL:?Set a URL-encoded Redis DSN for the redis service}"
  REDIS_ALLOW_INSECURE_TRANSPORT: "true"
  JWT_SECRET: "${JWT_SECRET:?Set a random JWT secret of at least 32 characters}"
  TOKEN_PEPPER: "${TOKEN_PEPPER:?Set an independent random token pepper of at least 32 characters}"
  JWT_ISSUER: "${JWT_ISSUER:-homayar}"
  JWT_AUDIENCE: "${JWT_AUDIENCE:-homayar-api}"
  SECURE_COOKIES: "${SECURE_COOKIES:-true}"
  COOKIE_DOMAIN: "${COOKIE_DOMAIN:-}"
  AUTO_CREATE_SCHEMA: "false"
  ENABLE_DEMO_ACCOUNT: "false"
  ALLOW_MOCK_PROVIDERS: "false"
  TASKS_EAGER: "false"
  RATE_LIMIT_FAIL_OPEN: "false"
  STORAGE_BACKEND: s3
  STORAGE_BUCKET: "${MINIO_BUCKET:-homayar-private}"
  STORAGE_ENDPOINT_URL: http://minio:9000
  # The bundled MinIO is reached over plain HTTP on the internal compose network only
  # (HOM-32 opt-out, same-host only since HOM-161).
  STORAGE_ALLOW_INSECURE_ENDPOINT: "true"
  STORAGE_REGION: "${STORAGE_REGION:-us-east-1}"
  STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY:?Set a dedicated MinIO application access key}"
  STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY:?Set a dedicated MinIO application secret key}"
  STORAGE_LOCAL_ROOT: /app/data/objects
  UPLOAD_DIR: /app/data/legacy-uploads
  UPLOAD_QUARANTINE_DIR: /app/data/quarantine
  # Tombstone journal (WP07-T04, ADR 0022): kept OUTSIDE the database and
  # object-store backups so a restore can reapply later deletions. Bind
  # TOMBSTONE_JOURNAL_PATH to a separately replicated mount in production.
  TOMBSTONE_JOURNAL_DIR: /app/tombstones
  ENABLE_NEO4J_PROJECTION: "false"
  LOG_LEVEL: "${LOG_LEVEL:-INFO}"
  # Prometheus scrape endpoint (HOM-113). Production needs METRICS_BEARER_TOKEN
  # (>= 32 characters); without it /metrics answers 404. On-premise only,
  # METRICS_ALLOW_UNAUTHENTICATED=true serves it without a token (logged at startup).
  METRICS_ENABLED: "${METRICS_ENABLED:-true}"
  METRICS_BEARER_TOKEN: "${METRICS_BEARER_TOKEN:-}"
  METRICS_ALLOW_UNAUTHENTICATED: "${METRICS_ALLOW_UNAUTHENTICATED:-false}"
  METRICS_CACHE_SECONDS: "${METRICS_CACHE_SECONDS:-15}"
  # Model registry and provider resilience (WP08, ADR 0026/0030). Leave
  # MODEL_MANIFEST_STRICT unset: strict by default outside development/test.
  MODEL_MANIFEST_PATHS: "${MODEL_MANIFEST_PATHS:-}"
  MODEL_MANIFEST_PINS: "${MODEL_MANIFEST_PINS:-}"
  JOB_RETRY_JITTER_RATIO: "${JOB_RETRY_JITTER_RATIO:-0.1}"
  PROVIDER_CIRCUIT_FAILURE_THRESHOLD: "${PROVIDER_CIRCUIT_FAILURE_THRESHOLD:-5}"
  PROVIDER_CIRCUIT_COOLDOWN_SECONDS: "${PROVIDER_CIRCUIT_COOLDOWN_SECONDS:-60}"
  PROVIDER_RATE_LIMITS: "${PROVIDER_RATE_LIMITS:-}"
  LLM_FALLBACK_BASE_URL: "${LLM_FALLBACK_BASE_URL:-}"
  LLM_FALLBACK_MODEL: "${LLM_FALLBACK_MODEL:-}"
  LLM_FALLBACK_API_KEY: "${LLM_FALLBACK_API_KEY:-}"
  # AI providers (ADR 0028/0029). The Padyar AI Gateway has no API contract
  # yet: selecting it fails jobs with provider_contract_unavailable.
  ASR_PROVIDER: "${ASR_PROVIDER:-local_whisper}"
  DIARIZATION_PROVIDER: "${DIARIZATION_PROVIDER:-unavailable}"
  INTELLIGENCE_PROVIDER: "${INTELLIGENCE_PROVIDER:-openai_compatible}"
  LOCAL_AI_BASE_URL: "${LOCAL_AI_BASE_URL:-}"
  WHISPER_MODEL: "${WHISPER_MODEL:-base}"
  WHISPER_DEVICE: "${WHISPER_DEVICE:-cpu}"
  WHISPER_COMPUTE_TYPE: "${WHISPER_COMPUTE_TYPE:-int8}"
  # Named Whisper profile and language policy (HOM-39, ADR 0044). An empty
  # profile keeps the WHISPER_* values above.
  ASR_PROFILE: "${ASR_PROFILE:-}"
  ASR_ALLOWED_LANGUAGES: "${ASR_ALLOWED_LANGUAGES:-fa,en}"
  ASR_DEFAULT_LANGUAGE: "${ASR_DEFAULT_LANGUAGE:-fa}"
  ASR_LANGUAGE_MIN_PROBABILITY: "${ASR_LANGUAGE_MIN_PROBABILITY:-0.5}"
  # Restricted PII mappings (ADR 0023): "key_id:base64(32 bytes)" from the
  # secret manager; empty keeps redaction but retains no originals.
  PII_MAPPING_KEYS: "${PII_MAPPING_KEYS:-}"
  PII_MAPPING_ACTIVE_KEY_ID: "${PII_MAPPING_ACTIVE_KEY_ID:-}"
  # Webhook signing secrets at rest (ADR 0047): same keyring format, from the
  # secret manager; empty refuses new webhook endpoints (503).
  WEBHOOK_SECRET_KEYS: "${WEBHOOK_SECRET_KEYS:-}"
  WEBHOOK_SECRET_ACTIVE_KEY_ID: "${WEBHOOK_SECRET_ACTIVE_KEY_ID:-}"
  # Sign-in and delivery providers: disabled unless configured. The API
  # refuses to start with a method enabled but its credentials missing, and
  # GET /api/v1/auth/methods tells the console what is available.
  ENABLE_GOOGLE_AUTH: "${ENABLE_GOOGLE_AUTH:-false}"
  GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
  GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
  GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
  ENABLE_PHONE_AUTH: "${ENABLE_PHONE_AUTH:-false}"
  ASANAK_API_KEY: "${ASANAK_API_KEY:-}"
  ASANAK_SENDER: "${ASANAK_SENDER:-}"
  SMTP_HOST: "${SMTP_HOST:-}"
  SMTP_PORT: "${SMTP_PORT:-587}"
  SMTP_USERNAME: "${SMTP_USERNAME:-}"
  SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
  SMTP_FROM: "${SMTP_FROM:-noreply@homayar.com}"
  SMTP_USE_TLS: "${SMTP_USE_TLS:-false}"
  ENABLE_FREE_DEMO: "${ENABLE_FREE_DEMO:-true}"
  DEMO_QUOTA_SECONDS: "${DEMO_QUOTA_SECONDS:-1800}"
  # Network egress (WP08-T06, ADR 0031): api and worker sit on internal
  # networks with no route out; outbound HTTP(S) (AI, Google, Asanak) goes
  # only through the egress proxy (profile "egress") and its allowlist. Unset
  # EGRESS_PROXY_URL (the air-gapped default) leaves no outbound path at all.
  HTTP_PROXY: "${EGRESS_PROXY_URL:-}"
  HTTPS_PROXY: "${EGRESS_PROXY_URL:-}"
  NO_PROXY: "postgres,redis,minio,neo4j,localhost,127.0.0.1"

x-api-image: &api-image
  image: "${API_IMAGE:-homayar/api:local}"
  build:
    context: ../..
    dockerfile: infra/docker/api.Dockerfile
    args:
      PYTHON_IMAGE: "${PYTHON_IMAGE:-python:3.12-slim-bookworm@sha256:34386ef0cb081344d7ec1c103ba398e6e9f64e9ab3a1509accc92a4e24a07258}"
      UV_VERSION: "${UV_VERSION:-0.11.24}"
      INSTALL_AI_LOCAL: "${INSTALL_AI_LOCAL:-false}"

services:
  proxy:
    image: "${NGINX_IMAGE:-nginx:1.28-alpine}"
    profiles: [onprem]
    user: "101:101"
    entrypoint: [nginx, -g, "daemon off;"]
    ports:
      - "${BIND_ADDRESS:-0.0.0.0}:${HTTP_PORT:-8080}:8080"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/conf.d/homayar.conf:/etc/nginx/conf.d/default.conf:ro
      - ../nginx/includes:/etc/nginx/includes:ro
    depends_on:
      console-web:
        condition: service_healthy
      api:
        condition: service_healthy
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/healthz]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # The only published service: edge for the host port, ingress to reach
    # the web services and the API (which have no route out themselves).
    networks: [edge, ingress]
    logging: *default-logging

  console-web:
    image: "${CONSOLE_WEB_IMAGE:-homayar/console-web:local}"
    profiles: [onprem]
    build:
      context: ../..
      dockerfile: infra/docker/console-web.Dockerfile
      args:
        NODE_IMAGE: "${NODE_IMAGE:-node:22-alpine@sha256:fe4f6d74e20370acb04ad889077d14d0f64a9c8ea6a42bc60cddf1e844699914}"
        NGINX_IMAGE: "${NGINX_IMAGE:-nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236}"
        VITE_API_URL: /api/v1
        VITE_BASE_PATH: /app/
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, http://127.0.0.1:8080/app/index.html]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [ingress]
    logging: *default-logging

  api:
    <<: *api-image
    profiles: [onprem]
    command:
      - /bin/sh
      - -ec
      - exec uvicorn backend.main:app --host 0.0.0.0 --port 8000 --workers "$${UVICORN_WORKERS}"
    environment:
      <<: *app-environment
      UVICORN_WORKERS: "${UVICORN_WORKERS:-2}"
      # Counters of all uvicorn workers in one tmpfs of their own (empty at every
      # container start, apart from the upload spool in /tmp): /metrics sums them.
      PROMETHEUS_MULTIPROC_DIR: /run/homayar-metrics
    volumes:
      - app_data:/app/data
      - "${TOMBSTONE_JOURNAL_PATH:-tombstone_journal}:/app/tombstones"
      - "${MODEL_MANIFEST_DIR:-../manifests}:/app/manifests:ro"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    read_only: true
    # uid/gid/mode: the image user (10001, infra/docker/api.Dockerfile) must own these.
    # Without them runc gives a tmpfs the mode of an existing mount point, owned by
    # root: after a restart /run/homayar-metrics was root 755 and every uvicorn
    # worker died on its metrics file. /tmp keeps the image's 1777.
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=512m
      - /app/logs:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700
      - /run/homayar-metrics:rw,noexec,nosuid,size=32m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [ingress, backend, egress]
    logging: *default-logging

  # Transactional-outbox recovery (WP06-T02): one beat instance republishes
  # dispatch rows left PENDING by a crash between commit and publication.
  # Run exactly one replica; concurrent sweeps are safe (SKIP LOCKED) but wasteful.
  scheduler:
    <<: *api-image
    profiles: [onprem]
    command:
      - /bin/sh
      - -ec
      - exec celery -A backend.celery_app beat --loglevel="$${LOG_LEVEL}" --schedule=/app/data/celerybeat-schedule
    environment:
      <<: *app-environment
    volumes:
      - app_data:/app/data
      - "${MODEL_MANIFEST_DIR:-../manifests}:/app/manifests:ro"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    # Without an explicit list Compose would attach the default network,
    # which has a route out; beat only needs PostgreSQL and Redis.
    networks: [backend]
    logging: *default-logging

  worker:
    <<: *api-image
    profiles: [onprem]
    command:
      - /bin/sh
      - -ec
      - exec celery -A backend.celery_app worker --queues processing --loglevel="$${LOG_LEVEL}" --concurrency="$${CELERY_CONCURRENCY}" --hostname="celery@%h"
    environment:
      <<: *app-environment
      CELERY_CONCURRENCY: "${CELERY_CONCURRENCY:-2}"
    volumes:
      - app_data:/app/data
      - "${TOMBSTONE_JOURNAL_PATH:-tombstone_journal}:/app/tombstones"
      - "${MODEL_MANIFEST_DIR:-../manifests}:/app/manifests:ro"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-bootstrap:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD-SHELL
        - celery -A backend.celery_app inspect ping --destination "celery@$$HOSTNAME" --timeout 5 | grep -q pong
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    restart: unless-stopped
    stop_grace_period: 2m
    init: true
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=1g
      # Owned by the image user 10001, as on the api (see there).
      - /app/logs:rw,noexec,nosuid,size=64m,uid=10001,gid=10001,mode=0700
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend, egress]
    logging: *default-logging

  # The single outbound path (WP08-T06, ADR 0031): deny-by-default Squid that
  # forwards only to the exact host:port lines of infra/egress/allowlist.txt.
  # Not published; api and worker reach it on the internal egress network.
  # Start it with --profile egress and set EGRESS_PROXY_URL=http://egress-proxy:3128.
  egress-proxy:
    image: "${EGRESS_PROXY_IMAGE:-homayar/egress-proxy:local}"
    profiles: [egress]
    build:
      context: ../..
      dockerfile: infra/docker/egress-proxy.Dockerfile
      args:
        ALPINE_IMAGE: "${ALPINE_IMAGE:-alpine:3.22@sha256:d406446bc05b82480756ce8f1287964d28768c23955fa9480d2a74a2eae7a654}"
    volumes:
      - "${EGRESS_ALLOWLIST_PATH:-../egress/allowlist.txt}:/etc/homayar/egress/allowlist.txt:ro"
    healthcheck:
      test: [CMD, nc, -z, 127.0.0.1, "3128"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [egress, outbound]
    logging: *default-logging

  # Restore step (WP07-T04, ADR 0022): after the PostgreSQL/MinIO restore and
  # the forward migrations, with api/worker stopped:
  #   ... run --rm tombstone-reapply reapply   then   ... run --rm tombstone-reapply verify
  tombstone-reapply:
    <<: *api-image
    profiles: [restore]
    entrypoint: ["python", "-m", "backend.jobs.tombstone_reapply"]
    command: ["verify"]
    environment: *app-environment
    volumes:
      - "${TOMBSTONE_JOURNAL_PATH:-tombstone_journal}:/app/tombstones:ro"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *default-logging

  # Backup, isolated restore and recovery (HOM-116/117, ADR 0035,
  # docs/operations/backup-restore.md). Wrapped by infra/scripts/backup.sh and
  # infra/scripts/restore-isolated.sh:
  #   ... --profile onprem --profile ops run --rm backup-tool create | verify | list | prune
  #   ... run --rm backup-tool restore|reconcile|promote <id> --staging-db <db>_restoring ...
  # A backup bypasses RLS, so the tool needs a superuser / BYPASSRLS login. Preferred: put
  # that DSN in the file BACKUP_DATABASE_URL_FILE names (mounted below). Without it,
  # DATABASE_URL must log in as POSTGRES_USER (superuser).
  # The key file comes from the secret manager and is never stored with the sets.
  backup-tool:
    <<: *api-image
    profiles: [ops]
    user: "${BACKUP_UID:-10001}:${BACKUP_GID:-10001}"
    entrypoint: ["python", "-m", "backend.backup"]
    command: ["list"]
    environment:
      <<: *app-environment
      BACKUP_ROOT: /backups
      HOMAYAR_BACKUP_KEY_FILE: /run/secrets/homayar-backup-key
      # The host variable names a file that holds the admin DSN, mounted read-only below.
      # Unset: this stays empty and the tool falls back to DATABASE_URL.
      BACKUP_DATABASE_URL_FILE: "${BACKUP_DATABASE_URL_FILE:+/run/secrets/homayar-backup-database-url}"
      HOMAYAR_BACKUP_TEXTFILE: /textfile/homayar_backup.prom
      HOMAYAR_RELEASE_SHA: "${HOMAYAR_RELEASE_SHA:-}"
      HOMAYAR_RELEASE_VERSION: "${HOMAYAR_RELEASE_VERSION:-}"
      API_IMAGE: "${API_IMAGE:-homayar/api:local}"
      HOMAYAR_BACKUP_S3_ENDPOINT: "${BACKUP_OFFSITE_S3_ENDPOINT:-}"
      HOMAYAR_BACKUP_S3_ACCESS_KEY: "${BACKUP_OFFSITE_S3_ACCESS_KEY:-}"
      HOMAYAR_BACKUP_S3_SECRET_KEY: "${BACKUP_OFFSITE_S3_SECRET_KEY:-}"
      HOMAYAR_BACKUP_S3_REGION: "${BACKUP_OFFSITE_S3_REGION:-us-east-1}"
    volumes:
      - "${BACKUP_ROOT:-../backups}:/backups"
      - "${BACKUP_KEY_FILE:-/dev/null}:/run/secrets/homayar-backup-key:ro"
      # The admin DSN file (BACKUP_DATABASE_URL_FILE above), read-only.
      - "${BACKUP_DATABASE_URL_FILE:-/dev/null}:/run/secrets/homayar-backup-database-url:ro"
      # node_exporter's textfile directory, outside the 0700 backup root (backup.sh requires it).
      - "${NODE_EXPORTER_TEXTFILE_DIR:-../node-exporter-textfile}:/textfile"
      - "${BACKUP_OFFSITE_PATH:-../backups-offsite}:/offsite"
      - "${TOMBSTONE_JOURNAL_PATH:-tombstone_journal}:/app/tombstones:ro"
    # No depends_on: the scripts start exactly the stores they need (and the
    # ops profile stays valid on its own, like minio-tools).
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    # backend: PostgreSQL and MinIO; egress: an s3:// off-site target through
    # the egress proxy (its host must be on the allowlist).
    networks: [backend, egress]
    logging: *default-logging

  # Host metrics and the backup freshness gauge (HOM-126 alert contract): the
  # textfile collector reads what backup-tool writes to NODE_EXPORTER_TEXTFILE_DIR
  # (homayar_backup_last_success_timestamp_seconds{target}). Opt-in profile;
  # Prometheus scrapes node-exporter:9100 as job "homayar-node" on the backend network.
  node-exporter:
    image: "${NODE_EXPORTER_IMAGE:-quay.io/prometheus/node-exporter:v1.9.1}"
    profiles: [monitoring]
    command:
      - --collector.textfile.directory=/textfile
      - --web.listen-address=:9100
    volumes:
      - "${NODE_EXPORTER_TEXTFILE_DIR:-../node-exporter-textfile}:/textfile:ro"
    restart: unless-stopped
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *default-logging

  migrate:
    <<: *api-image
    profiles: [migrate]
    command:
      - /bin/sh
      - -ec
      - >-
        test -f alembic.ini || { echo '/app/alembic.ini is required' >&2; exit 2; };
        exec alembic -c alembic.ini upgrade head
    environment: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *default-logging

  postgres:
    image: "${POSTGRES_IMAGE:-postgres:17-alpine}"
    profiles: [onprem]
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?Set the PostgreSQL database name}"
      POSTGRES_USER: "${POSTGRES_USER:?Set the PostgreSQL application role}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set a random PostgreSQL password}"
      POSTGRES_INITDB_ARGS: --data-checksums --encoding=UTF8
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - test "$$(cat /proc/1/comm)" = postgres && pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 1m
    shm_size: 256m
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *default-logging

  redis:
    image: "${REDIS_IMAGE:-redis:7.4-alpine}"
    profiles: [onprem]
    user: "${REDIS_UID:-999}:${REDIS_GID:-1000}"
    command:
      - /bin/sh
      - -ec
      - >-
        exec redis-server --appendonly yes --appendfsync everysec
        --save 60 1 --requirepass "$${REDIS_PASSWORD}"
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:?Set a random Redis password}"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD-SHELL, "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped
    stop_grace_period: 30s
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *default-logging

  # The official quay.io/minio images need a login now and the Docker Hub copies are
  # gone (HOM-286). These Bitnami legacy images run the same MinIO and mc commits and
  # get no more updates. They are pinned by digest and the release manifest records
  # them under bundled_images. The image runs as uid 1001, whose writable data
  # directory is /bitnami/minio/data. With "server" as the first argument the
  # entrypoint runs minio server directly, without Bitnami's setup step.
  minio:
    image: "${MINIO_IMAGE:-bitnamilegacy/minio:2025.4.22@sha256:50cec18ac4184af4671a78aedd5554942c8ae105d51a465fa82037949046da01}"
    profiles: [onprem]
    command: [server, /bitnami/minio/data, --console-address, ":9001"]
    environment:
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set a random MinIO root access key}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set a random MinIO root secret key}"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: [CMD-SHELL, "curl -fsS http://127.0.0.1:9000/minio/health/live >/dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    stop_grace_period: 1m
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *default-logging

  minio-bootstrap:
    image: "${MINIO_MC_IMAGE:-bitnamilegacy/minio-client:2025.4.16@sha256:8a86e441decf053093c5977d49290298295f850c7843652f93e970ab15871dd1}"
    profiles: [onprem]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        mc alias set local "$$MINIO_ENDPOINT" "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$MINIO_BUCKET"
        mc version enable "local/$$MINIO_BUCKET"
        mc anonymous set none "local/$$MINIO_BUCKET"
        printf '%s\n' \
          '{"Version":"2012-10-17","Statement":[' \
          '{"Effect":"Allow","Action":["s3:GetBucketLocation","s3:ListBucket","s3:ListBucketMultipartUploads"],"Resource":["arn:aws:s3:::'"$$MINIO_BUCKET"'"]},' \
          '{"Effect":"Allow","Action":["s3:AbortMultipartUpload","s3:DeleteObject","s3:GetObject","s3:ListMultipartUploadParts","s3:PutObject"],"Resource":["arn:aws:s3:::'"$$MINIO_BUCKET"'/*"]}' \
          ']}' > /tmp/homayar-app-policy.json
        mc admin policy create local homayar-app /tmp/homayar-app-policy.json ||
          mc admin policy update local homayar-app /tmp/homayar-app-policy.json
        mc admin user add local "$$STORAGE_ACCESS_KEY" "$$STORAGE_SECRET_KEY"
        mc admin policy attach local homayar-app --user "$$STORAGE_ACCESS_KEY"
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: "${MINIO_BUCKET:-homayar-private}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set a random MinIO root access key}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set a random MinIO root secret key}"
      STORAGE_ACCESS_KEY: "${STORAGE_ACCESS_KEY:?Set a dedicated MinIO application access key}"
      STORAGE_SECRET_KEY: "${STORAGE_SECRET_KEY:?Set a dedicated MinIO application secret key}"
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *default-logging

  minio-tools:
    image: "${MINIO_MC_IMAGE:-bitnamilegacy/minio-client:2025.4.16@sha256:8a86e441decf053093c5977d49290298295f850c7843652f93e970ab15871dd1}"
    profiles: [ops]
    user: "${BACKUP_UID:-1000}:${BACKUP_GID:-1000}"
    entrypoint: [/bin/sh, -ec]
    command: [mc --version]
    environment:
      MC_CONFIG_DIR: /tmp/.mc
      MINIO_ENDPOINT: http://minio:9000
      MINIO_BUCKET: "${MINIO_BUCKET:-homayar-private}"
      MINIO_ROOT_USER: "${MINIO_ROOT_USER:?Set a random MinIO root access key}"
      MINIO_ROOT_PASSWORD: "${MINIO_ROOT_PASSWORD:?Set a random MinIO root secret key}"
    volumes:
      - "${BACKUP_ROOT:-../backups}:/backups"
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=64m
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [backend]
    logging: *default-logging

volumes:
  app_data:
  tombstone_journal:
  postgres_data:
  redis_data:
  minio_data:

networks:
  # Published ingress only (nginx).
  edge:
  # nginx <-> public web, console and API; no route out.
  ingress:
    internal: true
  backend:
    internal: true
  # api/worker <-> egress proxy; no route out.
  egress:
    internal: true
  # egress proxy only: the one network with a route out.
  outbound:
