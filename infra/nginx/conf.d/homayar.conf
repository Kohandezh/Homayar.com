server {
    listen 8080 default_server;
    server_name _;

    set $public_upstream public-web:3000;
    set $console_upstream console-web:8080;
    set $api_upstream api:8000;

    include /etc/nginx/includes/security-headers.conf;

    location = /healthz {
        access_log off;
        default_type application/json;
        return 200 '{"status":"ok","component":"proxy"}';
    }

    location = /readyz {
        access_log off;
        include /etc/nginx/includes/proxy-common.conf;
        proxy_pass http://$api_upstream/readyz;
    }

    location = /api/v1 {
        return 308 /api/v1/;
    }

    # Session reads the console makes on every start and refresh are not
    # credential attempts: they use the general API budget, so users behind
    # one NAT do not share 5 requests a minute for them. The API still rate
    # limits login, registration, reset and OTP per IP and per identifier.
    location = /api/v1/auth/me {
        client_max_body_size 16k;
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_conn per_ip 20;
        include /etc/nginx/includes/proxy-common.conf;
        proxy_pass http://$api_upstream;
    }

    location = /api/v1/auth/methods {
        client_max_body_size 16k;
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_conn per_ip 20;
        include /etc/nginx/includes/proxy-common.conf;
        proxy_pass http://$api_upstream;
    }

    location = /api/v1/auth/refresh {
        client_max_body_size 16k;
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_conn per_ip 20;
        include /etc/nginx/includes/proxy-common.conf;
        proxy_pass http://$api_upstream;
    }

    location = /api/v1/auth/logout {
        client_max_body_size 16k;
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_conn per_ip 20;
        include /etc/nginx/includes/proxy-common.conf;
        proxy_pass http://$api_upstream;
    }

    location ^~ /api/v1/auth/ {
        client_max_body_size 1m;
        limit_req zone=auth_per_ip burst=10 nodelay;
        limit_conn per_ip 10;
        include /etc/nginx/includes/proxy-common.conf;
        proxy_pass http://$api_upstream;
    }

    location = /api/v1/uploads {
        include /etc/nginx/includes/upload-proxy.conf;
    }

    location ^~ /api/v1/uploads/ {
        include /etc/nginx/includes/upload-proxy.conf;
    }

    location ^~ /api/v1/ {
        client_max_body_size 16m;
        limit_req zone=api_per_ip burst=40 nodelay;
        limit_conn per_ip 20;
        include /etc/nginx/includes/proxy-common.conf;
        proxy_pass http://$api_upstream;
    }

    location = /app {
        return 308 /app/;
    }

    location ^~ /app/assets/ {
        limit_except GET HEAD OPTIONS { deny all; }
        include /etc/nginx/includes/proxy-common.conf;
        proxy_pass http://$console_upstream;
    }

    location ^~ /app/ {
        limit_except GET HEAD OPTIONS { deny all; }
        include /etc/nginx/includes/proxy-common.conf;
        proxy_intercept_errors on;
        error_page 404 = @console_spa;
        proxy_pass http://$console_upstream;
    }

    location @console_spa {
        include /etc/nginx/includes/proxy-common.conf;
        rewrite ^ /app/index.html? break;
        proxy_pass http://$console_upstream;
    }

    location / {
        include /etc/nginx/includes/proxy-common.conf;
        proxy_pass http://$public_upstream;
    }
}
