# One server behind a host nginx TLS front (compose.onprem.app-server.yaml,
# docs/operations/app-server.md). Mounted as /etc/nginx/conf.d/00-trusted-proxy.conf.
# The host nginx reaches this proxy through the published 127.0.0.1 port, so each of
# its connections arrives from the edge network gateway. Trust only that address, and
# take the client IP from X-Real-IP, which the host nginx overwrites with the visitor's
# IP. Keep the address in step with the edge gateway in compose.onprem.app-server.yaml.
set_real_ip_from 172.29.10.1;
real_ip_header X-Real-IP;
