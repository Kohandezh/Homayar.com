# Licences and runtime requirements of the offline bundle (HOM-107, ADR 0070).
#
# pack reads this file from the source checkout (infra/offline/bundle.conf)
# and writes its values into the signed BUNDLE.manifest of every package.
# It is a pack input only: it is never copied into a package and install and
# upgrade read the signed BUNDLE.manifest, never this file. Lines starting
# with '#' and empty lines are ignored in this input file only.
#
# The three Homayar images are proprietary (the repository has no open
# licence file); the value is an SPDX LicenseRef identifier.
license api LicenseRef-Homayar-Proprietary
license console-web LicenseRef-Homayar-Proprietary
license egress-proxy LicenseRef-Homayar-Proprietary

# The runtime dependencies of the install host. bash and openssl are what
# homayar-onprem.sh itself needs. docker-engine and docker-compose-plugin
# are ASSUMED floors taken from the values the test fixtures print, not
# measured on a real host; the network-denied install test (HOM-111) should
# confirm or correct them. nvidia-container-toolkit is needed only for the
# GPU profile; 'gpu-profile-only' is the constraint marker.
requires bash >=4.4
requires openssl >=3.0
requires docker-engine >=27.3.1
requires docker-compose-plugin >=2.29.7
requires nvidia-container-toolkit gpu-profile-only
