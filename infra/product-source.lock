# Homayar product source contract (ADR 0033; supersedes the external pin of ADR 0002).
#
# The product source (API, workers, console, migrations) is tracked in this
# repository under product_dir as ordinary files, in the same commit as the CI,
# Docker and Compose templates that build it. It must never be a gitlink or a
# submodule.
#
# Grammar: one "key=value" per line; blank lines and lines starting with "#"
# are ignored. "required_path" and "forbidden_path" may repeat and are relative
# to product_dir.
#
# Verified by infra/ci/check-source-contract.sh (local and ci modes).

product_dir=Homayar

# Provenance of the one-time import from the former product repository
# (informational; the checker reports whether the tree has changed since).
imported_from=https://github.com/Kohandezh/HomaYar.git
imported_ref=feat/commercial-v1-overlay
imported_sha=e7eeef53d6e864488405078e6eb93207bd3db051

# Paths that infra/docker/*.Dockerfile, infra/ci/check-migrations.sh and the
# console/backend CI jobs read from the product directory.
required_path=pyproject.toml
required_path=uv.lock
required_path=alembic.ini
required_path=backend/main.py
required_path=backend/migrations/env.py
required_path=backend/migrations/versions
required_path=frontend/package.json
required_path=frontend/package-lock.json
required_path=frontend/index.html
required_path=frontend/vite.config.ts
required_path=frontend/src

# Runtime data, environments, caches and reference material that must never be
# tracked.
forbidden_path=.env
forbidden_path=backend/.env
forbidden_path=homayar-dev.db
forbidden_path=uploads
forbidden_path=.venv
forbidden_path=sample
forbidden_path=graphify-out
forbidden_path=frontend/node_modules
forbidden_path=frontend/dist
forbidden_path=frontend/.env
forbidden_path=.mypy_cache
forbidden_path=.pytest_cache
forbidden_path=.ruff_cache
forbidden_path=backend/.pytest_cache
forbidden_path=backend/.venv
forbidden_path=data
forbidden_path=.claude/settings.local.json
